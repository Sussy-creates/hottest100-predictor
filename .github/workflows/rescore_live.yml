name: rescore-live

# Weekly (daily from January, see cron): refresh Spotify AU, rebuild songs and live features, score 2026 with model v2.
on:
  schedule:
    - cron: "23 19 * * 1"   # Mondays 19:23 UTC = Tuesday morning in Sydney
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/rescore_live.txt

permissions:
  contents: write

concurrency:
  group: rescore-live
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt kaggle six
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Refresh Spotify AU daily charts (Kaggle, updated daily)
        run: |
          mkdir -p /tmp/dl
          kaggle datasets download gonzalopezgil/spotify-charts-daily-updated -f charts_songs_daily.csv -p /tmp/dl
          python scripts/extract_spotify_au.py "$(ls /tmp/dl/* | head -1)" data/raw/spotify_au/gonzalopezgil --member charts_songs_daily.csv
      - name: Rebuild songs, live features, score
        run: |
          python scripts/build_songs.py
          python scripts/build_features.py live
          python analysis/v2.py live
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/spotify_au/gonzalopezgil* data/live reports/live_*_v2.csv
          git diff --cached --quiet && exit 0
          git commit -m "live: rescore $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
