name: search-archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/search_archives.py
      - triggers/search_archives.txt

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/search_archives.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: broad archive search for Shazam AU charts"
          git pull --rebase
          git push
