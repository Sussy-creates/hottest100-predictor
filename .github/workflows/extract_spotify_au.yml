name: extract-spotify-au

# Downloads each Kaggle chart dump, keeps Australian rows, commits parquet + coverage summary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/extract_spotify_au.txt

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gonzalopezgil
            ref: gonzalopezgil/spotify-charts-daily-updated
            file: charts_songs_daily.csv
          - name: dhruvildave
            ref: dhruvildave/spotify-charts
            file: charts.csv
          - name: jfreyberg
            ref: jfreyberg/spotify-chart-data
            file: ""
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --upgrade kaggle six pandas pyarrow
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Download
        run: |
          mkdir -p /tmp/dl
          if [ -n "${{ matrix.file }}" ]; then
            kaggle datasets download "${{ matrix.ref }}" -f "${{ matrix.file }}" -p /tmp/dl
          else
            kaggle datasets download "${{ matrix.ref }}" -p /tmp/dl
          fi
          ls -la /tmp/dl
      - name: Extract AU rows
        run: |
          mkdir -p data/raw/spotify_au
          f=$(ls /tmp/dl/* | head -1)
          if [ -n "${{ matrix.file }}" ]; then
            python scripts/extract_spotify_au.py "$f" "data/raw/spotify_au/${{ matrix.name }}" --member "${{ matrix.file }}"
          else
            # small multi-file dataset: list members, extract each CSV
            python -c "import zipfile,sys;[print(n, i.file_size) for n,i in ((i.filename,i) for i in zipfile.ZipFile(sys.argv[1]).infolist())]" "$f" | tee "data/raw/spotify_au/${{ matrix.name }}.members.txt"
            for m in $(python -c "import zipfile,sys;print(' '.join(n for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.endswith('.csv')))" "$f"); do
              stem=$(basename "$m" .csv)
              python scripts/extract_spotify_au.py "$f" "data/raw/spotify_au/${{ matrix.name }}__$stem" --member "$m" || true
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-${{ matrix.name }}
          path: data/raw/spotify_au
          retention-days: 7

  commit:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: spotify-*
          path: artifacts
          merge-multiple: true
      - name: Commit
        run: |
          mkdir -p data/raw/spotify_au
          cp -r artifacts/* data/raw/spotify_au/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/spotify_au
          git diff --cached --quiet || git commit -m "data: Spotify AU rows from Kaggle dumps"
          git pull --rebase
          git push
