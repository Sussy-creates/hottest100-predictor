name: probe-trends-targets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_trends_targets.py
      - .github/workflows/probe_trends_targets.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytrends pandas "urllib3<2"
      - run: python scripts/probe_trends_targets.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: Google Trends targets"
          git pull --rebase
          git push
