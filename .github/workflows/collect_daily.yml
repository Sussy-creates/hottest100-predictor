name: collect-daily

# Every day: save live chart pages and top up this month's triple j plays.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "43 17 * * *"  # backup: GitHub sometimes skips or delays scheduled runs
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/collect_daily.txt

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save live chart pages
        run: python scripts/collect_daily.py
      - name: Top up triple j plays (current month is refetched)
        run: python scripts/fetch_abc_plays.py $(date -u +%Y)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/daily data/raw/abc_plays
          git diff --cached --quiet || git commit -m "data: daily collection $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
