name: probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe.py
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe data sources
        run: python scripts/probe.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: data source check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
