name: probe-social

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_social.py
      - .github/workflows/probe_social.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo stdlib only
      - run: python scripts/probe_social.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: social signals"
          git pull --rebase
          git push
