name: fetch-wayback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_wayback.py
      - triggers/fetch_wayback.txt

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_wayback.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/wayback
          git diff --cached --quiet || git commit -m "data: Wayback captures of YouTube and Shazam AU charts"
          git pull --rebase
          git push
