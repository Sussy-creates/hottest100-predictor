name: probe-gaps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_gaps.py
      - triggers/probe_gaps.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_gaps.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "probe: airplay gap recheck and Shazam Wayback captures"
          git pull --rebase
          git push
