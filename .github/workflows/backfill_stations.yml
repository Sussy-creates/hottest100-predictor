name: backfill-other-stations

# Unearthed and Double J airplay for the voting-window months only (Sep-Dec, then Jan of the next year).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/backfill_stations.txt

permissions:
  contents: write

concurrency:
  group: backfill-stations
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        station: [unearthed, doublej]
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ${{ matrix.station }} ${{ matrix.year }}
        run: |
          python scripts/fetch_abc_plays.py ${{ matrix.year }} --station ${{ matrix.station }} --out data/raw/abc_plays_${{ matrix.station }} --months 1
          python scripts/fetch_abc_plays.py ${{ matrix.year }} --station ${{ matrix.station }} --out data/raw/abc_plays_${{ matrix.station }} --months 9-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st-${{ matrix.station }}-${{ matrix.year }}
          path: data/raw/abc_plays_${{ matrix.station }}/${{ matrix.year }}
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: st-*
          path: artifacts
      - name: Place files and commit
        run: |
          for d in artifacts/st-*; do
            n="${d#artifacts/st-}"; station="${n%-*}"; y="${n##*-}"
            mkdir -p "data/raw/abc_plays_$station/$y"
            cp -n "$d"/*.jsonl.gz "data/raw/abc_plays_$station/$y/" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "data: Unearthed and Double J plays, voting-window months"
          git pull --rebase
          git push
