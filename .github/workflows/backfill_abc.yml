name: backfill-abc-plays

# Runs on push of the trigger file so it can be re-run without the Actions API.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/backfill_abc.txt

permissions:
  contents: write

concurrency:
  group: backfill-abc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6  # keep load on the ABC API modest
      matrix:
        year: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ${{ matrix.year }}
        run: python scripts/fetch_abc_plays.py ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: abc-${{ matrix.year }}
          path: data/raw/abc_plays/${{ matrix.year }}
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: abc-*
          path: artifacts
      - name: Place files and commit
        run: |
          for d in artifacts/abc-*; do
            y="${d#artifacts/abc-}"
            mkdir -p "data/raw/abc_plays/$y"
            cp -n "$d"/*.jsonl.gz "data/raw/abc_plays/$y/" 2>/dev/null || true
            # current month is refetched each run, so overwrite that one
            cp "$d"/$(date -u +%Y-%m).jsonl.gz "data/raw/abc_plays/$y/" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/abc_plays
          git diff --cached --quiet || git commit -m "data: triple j plays backfill $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
